name: Build 100Gramm iOS

on:
  push:
    branches:
      - master
  workflow_dispatch:

jobs:
  build:
    runs-on: macos-15

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4
        with:
          submodules: recursive
          fetch-depth: 0

      - name: Select Xcode
        run: |
          sudo xcode-select -s /Applications/Xcode.app
          xcodebuild -version

      - name: Setup Python
        run: |
          python3 --version

      - name: Check Make.py syntax
        run: |
          python3 -m py_compile build-system/Make/Make.py

      - name: Build unsigned IPA
        env:
          BAZEL_USER_ROOT: ${{ runner.temp }}/bazel
          BUILD_NUMBER: ${{ github.run_number }}
        run: |
          mkdir -p "$BAZEL_USER_ROOT"

          python3 -u build-system/Make/Make.py \
            --bazelUserRoot="$BAZEL_USER_ROOT" \
            build \
            --configurationPath="build-system/appstore-configuration.json" \
            --codesigningInformationPath=build-system/fake-codesigning \
            --disableProvisioningProfiles \
            --configuration=release_arm64 \
            --buildNumber="$BUILD_NUMBER"

      - name: Find IPA
        run: |
          echo "Searching for IPA..."
          find bazel-out -type f -name "*.ipa" -print

      - name: Find DSYM
        run: |
          echo "Searching for dSYM..."
          find bazel-out -type d -name "*.app.dSYM" -print

      - name: Upload IPA
        uses: actions/upload-artifact@v4
        with:
          name: 100Gramm-iOS-${{ github.run_number }}
          path: |
            bazel-out/**/Telegram.ipa
          if-no-files-found: error

      - name: Upload dSYM
        uses: actions/upload-artifact@v4
        with:
          name: 100Gramm-dSYM-${{ github.run_number }}
          path: |
            bazel-out/**/*.app.dSYM/**
          if-no-files-found: warn
