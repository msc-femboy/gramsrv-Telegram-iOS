name: CI

on:
  push:
    branches:
      - master
  workflow_dispatch:

jobs:
  build:
    runs-on: macos-15

    steps:
      - name: Checkout
        uses: actions/checkout@v4
        with:
          submodules: recursive
          fetch-depth: 0

      - name: Fix Make.py
        shell: bash
        run: |
          set -e

          python3 -c "
          from pathlib import Path

          p = Path('build-system/Make/Make.py')
          s = p.read_text()

          # Fix remote_input_path
          s = s.replace(
              \"remote_input_path = '{}/build-input/remote-input'.format(base_path))\",
              \"remote_input_path = '{}/build-input/remote-input'.format(base_path)\"
          )

          s = s.replace(
              \"remote_input_path = '{}/build-input/remote-input'.format(base_path\",
              \"remote_input_path = '{}/build-input/remote-input'.format(base_path)\"
          )

          # Fix APS environment for unsigned builds
          old = '''    if codesigning_data.aps_environment is None:
        print('Could not find a valid aps-environment entitlement in the provided provisioning profiles')
        sys.exit(1)
'''

          new = '''    if codesigning_data.aps_environment is None:
        if getattr(arguments, 'disableProvisioningProfiles', False):
            codesigning_data.aps_environment = 'development'
        else:
            print('Could not find a valid aps-environment entitlement in the provided provisioning profiles')
            sys.exit(1)
'''

          if old in s:
              s = s.replace(old, new, 1)

          # Enable disableProvisioningProfiles in build()
          old = '''    bazel_command_line.set_enable_sandbox(arguments.sandbox)
    bazel_command_line.set_profile_swift(arguments.profileSwift)
'''

          new = '''    bazel_command_line.set_enable_sandbox(arguments.sandbox)

    if arguments.disableProvisioningProfiles:
        bazel_command_line.set_disable_provisioning_profiles()

    bazel_command_line.set_profile_swift(arguments.profileSwift)
'''

          if old in s:
              s = s.replace(old, new, 1)

          # Add CLI argument if it does not already exist
          if '--disableProvisioningProfiles' not in s:
              marker = '''    buildParser.add_argument(
        '--configuration',
'''

              pos = s.find(marker)

              if pos == -1:
                  raise SystemExit(
                      'Could not find buildParser configuration argument'
                  )

              end = s.find('\\n    )', pos)

              if end == -1:
                  raise SystemExit(
                      'Could not find end of configuration argument'
                  )

              end += len('\\n    )')

              argument = '''
    
    buildParser.add_argument(
        '--disableProvisioningProfiles',
        action='store_true',
        default=False,
        help='Build without provisioning profiles.'
    )
'''

              s = s[:end] + argument + s[end:]

          p.write_text(s)
          print('Make.py patched successfully')
          "

          python3 -m py_compile build-system/Make/Make.py

          echo "Make.py syntax OK"

      - name: Set active Xcode path
        shell: bash
        run: |
          set -e

          XCODE_VERSION=$(python3 -c 'import json; print(json.load(open("versions.json"))["xcode"])')

          echo "Xcode version: $XCODE_VERSION"

          sudo xcode-select -s "/Applications/Xcode_${XCODE_VERSION}.app/Contents/Developer"

          xcodebuild -version

      - name: Create canonical source directory
        shell: bash
        run: |
          set -e

          sudo mkdir -p /Users/Shared

          cp -R "$GITHUB_WORKSPACE" /Users/Shared/

          mv \
            "/Users/Shared/$(basename "$GITHUB_WORKSPACE")" \
            /Users/Shared/telegram-ios

      - name: Build the App
        shell: bash
        run: |
          set -e
          set -x

          SOURCE_DIR="/Users/Shared/telegram-ios"
          BAZEL_USER_ROOT="/private/var/tmp/_bazel_containerhost"

          cd "$SOURCE_DIR"

          BUILD_NUMBER_OFFSET="$(cat build_number_offset)"

          APP_VERSION="$(python3 -c 'import json; print(json.load(open("versions.json"))["app"])')"

          COMMIT_COUNT="$(git rev-list --count HEAD)"

          COMMIT_COUNT="$((COMMIT_COUNT + BUILD_NUMBER_OFFSET))"

          BUILD_NUMBER="$COMMIT_COUNT"

          export APP_VERSION
          export BUILD_NUMBER

          echo "APP_VERSION=$APP_VERSION" >> "$GITHUB_ENV"
          echo "BUILD_NUMBER=$BUILD_NUMBER" >> "$GITHUB_ENV"

          echo "APP_VERSION=$APP_VERSION"
          echo "BUILD_NUMBER=$BUILD_NUMBER"

          python3 build-system/Make/ImportCertificates.py \
            --path build-system/fake-codesigning/certs

          python3 -u build-system/Make/Make.py \
            --bazelUserRoot="$BAZEL_USER_ROOT" \
            build \
            --configurationPath="build-system/appstore-configuration.json" \
            --codesigningInformationPath=build-system/fake-codesigning \
            --disableProvisioningProfiles \
            --configuration=release_arm64 \
            --buildNumber="$BUILD_NUMBER"

          OUTPUT_PATH="build/artifacts"

          rm -rf "$OUTPUT_PATH"
          mkdir -p "$OUTPUT_PATH"

          FOUND_IPA=0

          for f in bazel-out/applebin_ios-ios_arm*-opt-ST-*/bin/Telegram/Telegram.ipa; do
            if [ -f "$f" ]; then
              cp "$f" "$OUTPUT_PATH/100Gramm.ipa"
              FOUND_IPA=1
            fi
          done

          if [ "$FOUND_IPA" -eq 0 ]; then
            echo "ERROR: IPA was not found"
            find bazel-out -name "*.ipa" -print || true
            exit 1
          fi

          mkdir -p build/DSYMs

          for f in bazel-out/applebin_ios-ios_arm*-opt-ST-*/bin/Telegram/*.dSYM; do
            if [ -d "$f" ]; then
              cp -R "$f" build/DSYMs/
            fi
          done

          zip -r \
            "$OUTPUT_PATH/100Gramm.DSYMs.zip" \
            build/DSYMs \
            >/dev/null

          echo "Build artifacts:"
          ls -lh "$OUTPUT_PATH"

      - name: Create Release
        id: create_release
        uses: actions/create-release@v1
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        with:
          tag_name: build-${{ env.BUILD_NUMBER }}
          release_name: 100Gramm ${{ env.APP_VERSION }} (${{ env.BUILD_NUMBER }})
          body: |
            An unsigned build of 100Gramm for iOS ${{ env.APP_VERSION }} (${{ env.BUILD_NUMBER }}).

            Bundle ID: org.100gramm.ios

            Push Notifications entitlement: development
          draft: false
          prerelease: false

      - name: Upload Release IPA
        id: upload-release-ipa
        uses: actions/upload-release-asset@v1
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        with:
          upload_url: ${{ steps.create_release.outputs.upload_url }}
          asset_path: /Users/Shared/telegram-ios/build/artifacts/100Gramm.ipa
          asset_name: 100Gramm.ipa
          asset_content_type: application/zip

      - name: Upload Release DSYM
        id: upload-release-dsym
        uses: actions/upload-release-asset@v1
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        with:
          upload_url: ${{ steps.create_release.outputs.upload_url }}
          asset_path: /Users/Shared/telegram-ios/build/artifacts/100Gramm.DSYMs.zip
          asset_name: 100Gramm.DSYMs.zip
          asset_content_type: application/zip
